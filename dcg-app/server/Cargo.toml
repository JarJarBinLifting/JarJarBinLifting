[package]
name = "dcg-server"
version = "0.1.0"
description = "DCG Étude — tuteur IA + agenda de révision (local web app)"
authors = ["Amadou"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "dcg-server"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.5", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
open = "5"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
