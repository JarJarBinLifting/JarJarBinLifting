[package]
name = "dcg-server"
version = "0.1.0"
description = "DCG Étude — tuteur IA + agenda de révision (local web app)"
authors = ["Amadou"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "dcg-server"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.5", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
open = "5"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# keyring v3 ships its platform backends as opt-in features — without them it
# compiles everywhere but stores nothing, and every key save silently lands in
# the plaintext fallback. One backend per platform; "vendored" on Linux builds
# libdbus statically so the binary doesn't need dbus dev headers at build time.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }

[dev-dependencies]
tempfile = "3"
